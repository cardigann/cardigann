---
  site: torrentz2
  name: Torrentz2
  language: en-us
  links:
    - https://torrentz2.eu/

  caps:
    categories:
      "Video Tv": TV
      "Video": Movies
      "Video Movie HD": Movies/HD

    modes:
      search: [q]
      tv-search: [q, season, ep]

  search:
    path: feed 
    inputs:
       f: "{{ .Query.Keywords }}"
    rows:
      selector: "rss channel item"
    fields:
      title:
        selector: title
      download:
        selector: description
        filters:
          - name: regexp
            args: "Hash: (\\w+)"
      category:
        selector: category
      date:
        selector: pubDate
        filters:
          - name: replace
            args: [" 0:", " 00:"]
          - name: replace
            args: [" 1:", " 01:"]
          - name: replace
            args: [" 2:", " 02:"]
          - name: replace
            args: [" 3:", " 03:"]
          - name: replace
            args: [" 4:", " 04:"]
          - name: replace
            args: [" 5:", " 05:"]
          - name: replace
            args: [" 6:", " 06:"]
          - name: replace
            args: [" 7:", " 07:"]
          - name: replace
            args: [" 8:", " 08:"]
          - name: replace
            args: [" 9:", " 09:"]
          - name: dateparse
            args: "Mon, 2 Jan 2006 15:04:05 -0700"
      size:
        selector: description
        filters:
          - name: regexp
            args: "Size: (\\d+ ..)"
      seeders:
        selector: description
        filters:
          - name: regexp
            args: "Seeds: (\\d+)"
      leechers:
        selector: description
        filters:
          - name: regexp
            args: "Peers: (\\d+)"
